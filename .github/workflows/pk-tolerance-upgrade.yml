name: Mejorar modelo de tolerancia PK

on:
  push:
    paths:
      - '.github/workflows/pk-tolerance-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar modelo farmacocinético-adaptativo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          s = s.replace("const APP_VERSION = '2.1.0';", "const APP_VERSION = '2.2.0';")

          new_model = r'''// Modelo orientativo PK-adaptativo de tolerancia.
// Capa 1: farmacocinética oral (absorción + eliminación).
// Capa 2: compartimento de efecto (retardo plasma-CNS).
// Capa 3: dos memorias neuroadaptativas con velocidades distintas.
// No es un modelo clínico validado y no debe utilizarse para calcular dosis.
const MODEL = {
  // DailyMed: biodisponibilidad oral ~90%, Tmax ~2 h, semivida plasmática ~12 h.
  bioavailability: 0.90,
  eliminationHalfLifeHours: 12,
  // ka derivada de Tmax≈2 h y t1/2≈12 h para absorción de primer orden.
  absorptionRatePerHour: 1.76855,
  // PK/PD oral publicado: semivida de equilibrado del compartimento de efecto ~0,43 h.
  effectSiteHalfLifeHours: 0.43,
  integrationStepHours: 0.25,

  // El historial previo se aproxima como una exposición estable repartida 3 veces/día.
  prehistoryDays: 90,
  baselineDosesPerDay: 3,

  // Transformación exposición-CNS -> señal adaptativa. Calibrada para que
  // 6 mg/día crónicos produzcan ~81/100, conservando el punto de partida previo.
  driveEC50EqMg: 1.20,
  driveHillN: 1.40,

  // Dos escalas de neuroadaptación: parámetros heurísticos, no clínicos.
  fastHalfLifeDays: 3.5,
  slowHalfLifeDays: 21,
  fastWeight: 0.42,
  slowWeight: 0.58,
  defaultBaselineMg: 6
};'''

          s, n = re.subn(r"// Modelo orientativo de tolerancia:.*?const MODEL = \{.*?\n\};", new_model, s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('No se pudo sustituir MODEL')

          new_pk = r'''function decayFactor(halfLife,elapsed){return Math.pow(0.5,elapsed/halfLife);}

function modelPkConstants(){
  return {
    ka: MODEL.absorptionRatePerHour,
    ke: Math.log(2)/MODEL.eliminationHalfLifeHours,
    keo: Math.log(2)/MODEL.effectSiteHalfLifeHours
  };
}

function baselineVirtualEvents(start){
  const daily=Math.max(0,Number(state.baselineDailyMg)||0);
  if(daily<=0)return [];
  const perDose=daily/MODEL.baselineDosesPerDay;
  const spacing=24/MODEL.baselineDosesPerDay;
  const events=[];
  for(let day=MODEL.prehistoryDays;day>=1;day--){
    const dayStart=new Date(start.getTime()-day*86400000);
    for(let k=0;k<MODEL.baselineDosesPerDay;k++){
      events.push({date:new Date(dayStart.getTime()+k*spacing*3600000),dose:perDose,virtual:true});
    }
  }
  return events;
}

function realLorazepamEvents(start,now){
  return state.logs
    .filter(l=>l.drug==='lorazepam')
    .map(l=>({date:new Date(l.at),dose:Math.max(0,Number(l.amountMg)||0),virtual:false}))
    .filter(e=>!Number.isNaN(e.date.getTime()) && e.date>=start && e.date<=now && e.dose>0);
}

function toleranceDrive(effectSiteEqMg){
  const c=Math.max(0,effectSiteEqMg);
  if(c===0)return 0;
  const cN=Math.pow(c,MODEL.driveHillN);
  const ecN=Math.pow(MODEL.driveEC50EqMg,MODEL.driveHillN);
  return 100*cN/(cN+ecN);
}

function toleranceScoreAt(now=new Date()){
  const start=modelStartDate();
  const end=now instanceof Date?now:new Date(now);
  if(Number.isNaN(end.getTime()))return {score:0,fast:0,slow:0,plasmaEq:0,effectSiteEq:0,drive:0};

  // Para no inventar un historial detallado anterior al seguimiento, la media
  // configurada se reconstruye durante 90 días como 3 tomas/día. Esto crea un
  // estado de equilibrio farmacocinético y una adaptación lenta coherente.
  const preStart=new Date(start.getTime()-MODEL.prehistoryDays*86400000);
  const events=[...baselineVirtualEvents(start),...realLorazepamEvents(start,end)]
    .filter(e=>e.date>=preStart && e.date<=end)
    .sort((a,b)=>a.date-b.date);

  const {ka,ke,keo}=modelPkConstants();
  let gut=0;          // cantidad oral todavía pendiente de absorber (mg-equivalentes)
  let plasma=0;       // exposición sistémica relativa
  let effectSite=0;   // exposición CNS relativa con retardo plasma-efecto
  let fast=0;
  let slow=0;
  let cursor=new Date(preStart);
  let eventIndex=0;
  const maxStepMs=MODEL.integrationStepHours*3600000;

  while(cursor<end){
    while(eventIndex<events.length && events[eventIndex].date<=cursor){
      gut+=events[eventIndex].dose*MODEL.bioavailability;
      eventIndex++;
    }

    let nextMs=Math.min(cursor.getTime()+maxStepMs,end.getTime());
    if(eventIndex<events.length){
      const eventMs=events[eventIndex].date.getTime();
      if(eventMs>cursor.getTime() && eventMs<nextMs)nextMs=eventMs;
    }
    const dtHours=Math.max(0,(nextMs-cursor.getTime())/3600000);
    if(dtHours<=0){cursor=new Date(nextMs+1);continue;}

    const gut0=gut;
    const plasma0=plasma;
    const eKa=Math.exp(-ka*dtHours);
    const eKe=Math.exp(-ke*dtHours);
    gut=gut0*eKa;
    plasma=plasma0*eKe + gut0*ka/(ka-ke)*(eKe-eKa);

    // Compartimento de efecto: usa la exposición plasmática media del intervalo.
    const plasmaMean=(plasma0+plasma)/2;
    const effectAlpha=1-Math.exp(-keo*dtHours);
    effectSite+= (plasmaMean-effectSite)*effectAlpha;

    // La adaptación sigue la exposición CNS, no los miligramos brutos.
    // Así, la hora y el reparto de las tomas sí cambian la trayectoria del modelo.
    const drive=toleranceDrive(effectSite);
    const dtDays=dtHours/24;
    const fastAlpha=1-decayFactor(MODEL.fastHalfLifeDays,dtDays);
    const slowAlpha=1-decayFactor(MODEL.slowHalfLifeDays,dtDays);
    fast+=(drive-fast)*fastAlpha;
    slow+=(drive-slow)*slowAlpha;

    cursor=new Date(nextMs);
  }

  while(eventIndex<events.length && events[eventIndex].date<=end){
    gut+=events[eventIndex].dose*MODEL.bioavailability;
    eventIndex++;
  }

  const score=Math.max(0,Math.min(100,MODEL.fastWeight*fast+MODEL.slowWeight*slow));
  return {
    score,
    fast,
    slow,
    plasmaEq:Math.max(0,plasma),
    effectSiteEq:Math.max(0,effectSite),
    drive:toleranceDrive(effectSite)
  };
}'''

          pattern = r"function decayFactor\(halfLifeDays,days\)\{.*?\n\}\n\nfunction toleranceScoreAt\(now=new Date\(\)\)\{.*?\n\}\n(?=\nfunction toleranceScoreDaysAgo)"
          s, n = re.subn(pattern, new_pk, s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('No se pudo sustituir toleranceScoreAt')

          s = s.replace("let exp='El modelo está todavía muy influido por el punto de partida.';\n  if(registered>=7)exp='Tus registros ya tienen un peso importante en la estimación.';\n  if(registered>=21)exp='La tendencia depende sobre todo de tu historial registrado reciente.';",
                        "let exp='Modelo PK activo: absorción, eliminación y horario real de las tomas. Aún pesa bastante el punto de partida.';\n  if(registered>=7)exp='El horario y las cantidades registradas ya tienen un peso importante en la estimación.';\n  if(registered>=21)exp='La trayectoria depende sobre todo de tu exposición real registrada y de la memoria adaptativa lenta.';")
          app.write_text(s,encoding='utf-8')

          index = Path('index.html')
          h=index.read_text(encoding='utf-8')
          h=h.replace('v=2.1.0','v=2.2.0').replace('v=2.0.0','v=2.2.0')
          old = '''      <div class="formula-card">
        <span>1 · Dos escalas de adaptación</span>
        <strong>rápida: 3,5 días · lenta: 21 días</strong>
        <p>Cada toma registrada alimenta dos estados exponenciales. Si dejas de tomar lorazepam, ambos decaen gradualmente; el lento tarda más.</p>
      </div>
      <div class="formula-card">
        <span>2 · Respuesta no lineal</span>
        <strong>combinación ponderada + curva de Hill</strong>
        <p>La exposición acumulada se transforma mediante una curva sigmoide a una escala 0–100, por lo que el indicador no es una simple regla de tres.</p>
      </div>
      <div class="formula-card">
        <span>3 · Punto de partida</span>
        <strong>6 mg/día de exposición reciente estimada</strong>
        <p>Es un punto inicial deliberadamente alto basado en la pauta/consumo reciente descrito. Con el tiempo pierde peso y mandan tus registros reales.</p>
      </div>'''
          new = '''      <div class="formula-card">
        <span>1 · Farmacocinética de cada toma</span>
        <strong>absorción oral + eliminación + compartimento de efecto</strong>
        <p>El modelo usa biodisponibilidad oral ~90%, pico plasmático alrededor de 2 h, semivida plasmática ~12 h y un pequeño retardo plasma-CNS. Por eso 4 mg juntos y 4 mg repartidos ya no generan la misma curva de exposición.</p>
      </div>
      <div class="formula-card">
        <span>2 · Dos memorias de adaptación</span>
        <strong>rápida: 3,5 días · lenta: 21 días</strong>
        <p>La exposición estimada en el sistema nervioso alimenta dos procesos adaptativos. Al bajar o parar, la parte rápida cae antes y la lenta conserva memoria durante más tiempo.</p>
      </div>
      <div class="formula-card">
        <span>3 · Respuesta no lineal</span>
        <strong>exposición CNS + curva sigmoide + ponderación temporal</strong>
        <p>No suma miligramos sin más: integra la curva de exposición a lo largo del tiempo y la transforma de forma no lineal antes de actualizar el 0–100.</p>
      </div>
      <div class="formula-card">
        <span>4 · Punto de partida</span>
        <strong>90 días virtuales a la media previa configurada</strong>
        <p>La app reconstruye una exposición estable anterior al inicio usando tu media previa. Después del inicio, esa historia se sustituye progresivamente por las horas y cantidades reales que registras.</p>
      </div>'''
          if old not in h:
            raise SystemExit('No se encontró bloque informativo antiguo')
          h=h.replace(old,new)
          h=h.replace('Farmacología de lorazepam / DailyMed ↗</a>', 'Farmacología de lorazepam / DailyMed ↗</a>\n        <a href="https://pubmed.ncbi.nlm.nih.gov/2348383/" target="_blank" rel="noopener">Modelo PK/PD con compartimento de efecto ↗</a>')
          index.write_text(h,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          a=r.index('## Modelo orientativo de tolerancia')
          b=r.index('## Persistencia de datos')
          section='''## Modelo orientativo de tolerancia\n\nNo existe una ecuación clínica validada que mida la tolerancia individual a benzodiacepinas solo desde un historial de dosis. La app usa un modelo **PK-adaptativo** para visualizar tendencia, no para decidir dosis.\n\n### 1. Farmacocinética oral\n\nCada toma se introduce en un modelo de absorción de primer orden y eliminación:\n\n- biodisponibilidad oral: 0,90;\n- Tmax objetivo: ~2 h;\n- semivida de eliminación: ~12 h;\n- `ka` derivada de Tmax y `ke`: 1,76855 h⁻¹;\n- compartimento de efecto con semivida de equilibrado ~0,43 h.\n\nLa integración se hace cada 15 minutos. Así la hora y la concentración de las tomas importan: una cantidad tomada de golpe produce una curva distinta a la misma cantidad repartida.\n\n### 2. Señal adaptativa\n\nLa exposición estimada en el compartimento de efecto se convierte con una curva de Hill (`n=1,40`, `EC50 relativa=1,20 mg-equivalentes`) en una señal 0–100. Esa señal alimenta dos estados neuroadaptativos:\n\n- componente rápida: semivida adaptativa heurística de 3,5 días;\n- componente lenta: semivida adaptativa heurística de 21 días;\n- pesos: 42% rápida + 58% lenta.\n\n### 3. Punto de partida\n\nAntes de la fecha de inicio se reconstruyen 90 días virtuales a la media previa configurada, repartida en tres exposiciones diarias. Con 6 mg/día el modelo queda calibrado alrededor de 81/100, igual que el punto inicial anterior. Después del inicio, mandan las tomas reales registradas.\n\nLos parámetros farmacocinéticos están anclados a datos publicados; las velocidades de neuroadaptación siguen siendo **heurísticas**, porque no existe en humanos un modelo validado capaz de convertir consumo individual en un porcentaje real de tolerancia. Además, la tolerancia puede diferir entre efectos sedantes, ansiolíticos, anticonvulsivantes y cognitivos.\n\nReferencias conceptuales:\n\n- DailyMed, lorazepam: biodisponibilidad ~90%, Tmax ~2 h y semivida plasmática media ~12 h: https://dailymed.nlm.nih.gov/\n- Mandema et al. *Simultaneous modeling ... Lorazepam*: modelo con absorción de primer orden y compartimento de efecto, `t1/2keo` ~0,43 h: https://pubmed.ncbi.nlm.nih.gov/2348383/\n- Blin et al. *Pharmacokinetic and pharmacodynamic analysis ... lorazepam*: modelo PK/PD oral de dos compartimentos y respuesta indirecta: https://pubmed.ncbi.nlm.nih.gov/11307041/\n- Vinkers & Olivier. *Mechanisms Underlying Tolerance after Long-Term Benzodiazepine Use*: https://pmc.ncbi.nlm.nih.gov/articles/PMC3321276/\n- *Synaptic correlates of benzodiazepine tolerance* (2026): https://pmc.ncbi.nlm.nih.gov/articles/PMC13269140/\n\n**El índice no es una medición biológica y no se utiliza para calcular cuántos comprimidos producirían un efecto determinado.**\n\n'''
          r=r[:a]+section+r[b:]
          readme.write_text(r,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8').replace('v2.1.0','v2.2.0')
          sw.write_text(w,encoding='utf-8')
          PY
          node --check app.js
      - name: Publicar actualización
        shell: bash
        run: |
          git config user.name "sergitomas20"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pk-tolerance-upgrade.yml
          git add app.js index.html README.md sw.js
          git commit -m "Mejorar tolerancia con modelo farmacocinetico [skip ci]"
          git push
